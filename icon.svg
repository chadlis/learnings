<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fiches ML/LLM">
<title>Fiches ML/LLM</title>
<desc>Un tableau noir, trois lignes à la craie et une coche : une fiche relue.</desc>
<defs>
  <filter id="craie" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="grain"/>
    <feDisplacementMap in="SourceGraphic" in2="grain" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect width="512" height="512" fill="#20312C"/>
<g filter="url(#craie)" fill="none" stroke="#EDE8DA" stroke-linecap="round" stroke-linejoin="round">
  <rect x="96" y="100" width="320" height="264" rx="16" stroke-width="12"/>
  <path d="M140 164 h148" stroke-width="17"/>
  <path d="M140 214 h232" stroke-width="14" opacity=".82"/>
  <path d="M140 262 h186" stroke-width="14" opacity=".66"/>
  <path d="M292 302 l30 28 l60 -80" stroke-width="19"/>
  <path d="M128 400 h256" stroke-width="10" opacity=".5"/>
</g>
</svg>
